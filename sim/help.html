<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROV Pool help</title>
<style>
  :root { --bg: #f6fafc; --fg: #14232e; --muted: #4a6272; --accent: #1d6f9f; --card: #ffffff; --line: #cfdde6; --code: #eaf1f5; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b1c28; --fg: #e4eef4; --muted: #9fb6c4; --accent: #6cc0ee; --card: #11293a; --line: #274457; --code: #0a1823; } }
  :root[data-theme="dark"] { --bg: #0b1c28; --fg: #e4eef4; --muted: #9fb6c4; --accent: #6cc0ee; --card: #11293a; --line: #274457; --code: #0a1823; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width: 52rem; margin: 0 auto; padding: 1rem 16px 4rem; }
  .top { display: flex; gap: 1rem; align-items: center; padding: .6rem 16px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; }
  .top a { color: var(--accent); font-weight: 600; text-decoration: none; }
  h1 { font-size: 1.9rem; margin: 1rem 0 .4rem; } h2 { font-size: 1.4rem; margin: 2.2rem 0 .4rem; padding-top: .4rem; border-top: 1px solid var(--line); }
  h1, h2, h3 { scroll-margin-top: 3.5rem; }                      /* so a link to a section does not hide it under the sticky bar */
  h3 { font-size: 1.1rem; margin: 1.6rem 0 .2rem; } a { color: var(--accent); }
  code { background: var(--code); padding: .1em .35em; border-radius: 4px; font: .9em ui-monospace, Menlo, Consolas, monospace; }
  pre { background: var(--code); padding: .8rem 1rem; border-radius: 8px; overflow-x: auto; border: 1px solid var(--line); }
  pre code { background: none; padding: 0; font-size: .85rem; }
  table { border-collapse: collapse; width: 100%; margin: .8rem 0; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--line); padding: .35rem .6rem; text-align: left; vertical-align: top; }
  th { background: var(--card); }
  blockquote { margin: 1rem 0; padding: .5rem 1rem; border-left: 4px solid var(--accent); background: var(--card); border-radius: 0 8px 8px 0; }
  li { margin: .15rem 0; }
</style>
</head>
<body>
<div class="top"><a href="index.html">&larr; Back to the pool</a><span id="where"></span></div>
<main id="doc">Loading the help...</main>
<script type="module">
import { render } from "./mdrender.js";
const doc = document.getElementById("doc");
try {
  const res = await fetch("help.md", { cache: "no-cache" });
  if (!res.ok) throw new Error(res.status);
  const md = await res.text();
  doc.innerHTML = render(md);                                   // render() escapes all HTML in the text
  const h1 = doc.querySelector("h1");
  if (h1) document.title = h1.textContent;
  if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
} catch (e) {
  doc.innerHTML = "<p>Could not load <code>help.md</code> (" + e.message + "). Open <a href='help.md'>help.md</a> directly.</p>";
}
</script>
</body>
</html>
