---
layout: page
title: Year
permalink: /year/
---

<style>
  #year-wrap { max-width: 860px; margin: 0 auto; }

  .year-legend {
    display: flex; flex-wrap: wrap; gap: 0.4em 1.2em;
    margin-bottom: 1.2em;
    font-size: 0.78em; font-family: Arial, sans-serif; color: #444;
  }
  .leg-item { display: flex; align-items: center; gap: 0.35em; }
  .leg-swatch {
    width: 11px; height: 11px; border-radius: 2px;
    display: inline-block; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.08);
  }

  /* Two-column layout: left half / right half */
  .year-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 2.8em;
  }
  @media (max-width: 560px) {
    .year-columns { grid-template-columns: 1fr; }
  }
  .year-col { display: flex; flex-direction: column; gap: 1em; }

  .month-title {
    font-family: Arial, sans-serif; font-weight: bold;
    font-size: 0.82em; color: #1a3a6b;
    margin-bottom: 0.2em; letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .month-cal {
    width: 100%; border-collapse: collapse;
    font-family: Arial, sans-serif; font-size: 0.72em;
    table-layout: fixed;
  }
  .month-cal th {
    text-align: center; padding: 1px 0;
    color: #888; font-weight: bold; font-size: 0.82em;
  }
  .month-cal td {
    text-align: center; padding: 2px 1px; line-height: 1.55;
    border-radius: 2px;
  }
  .month-cal td:empty { background: none; }

  /* Event type cell colors */
  .month-cal td.ev-class        { background: #c7d7fb; }
  .month-cal td.ev-service      { background: #fed7aa; }
  .month-cal td.ev-competition  { background: #bbf7d0; }
  .month-cal td.ev-workday      { background: #fef9c3; }
  .month-cal td.ev-fieldtrip    { background: #e9d5ff; }
  .month-cal td.ev-mentors      { background: #fce7f3; }
  .month-cal td.ev-presentation { background: #ccfbf1; }
  .month-cal td.ev-noschool     { background: #fee2e2; color: #b00; }
  .month-cal td.ev-other        { background: #f3f4f6; }
  .month-cal td.ev-cancelled    { background: #e5e7eb; color: #aaa; }
</style>

<div id="year-loading" style="text-align:center;padding:2em;color:#666;">Loading&hellip;</div>
<div id="year-wrap" style="display:none">
  <div class="year-legend">
    <span class="leg-item"><span class="leg-swatch" style="background:#c7d7fb"></span>Class</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#fed7aa"></span>Service</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#bbf7d0"></span>Competition</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#fef9c3"></span>Workday</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#e9d5ff"></span>Field Trip</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#fce7f3"></span>Mentors</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#ccfbf1"></span>Presentation</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#fee2e2"></span>No School</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#f3f4f6"></span>Other</span>
  </div>
  <div class="year-columns">
    <div class="year-col" id="col-left"></div>
    <div class="year-col" id="col-right"></div>
  </div>
</div>

<script src="{{ '/assets/js/rov-common.js' | relative_url }}"></script>
<script>
// When multiple event types fall on the same day, show the highest-priority one.
const TYPE_PRIORITY = {
  'competition': 0, 'fieldtrip': 1, 'service': 2,
  'mentors': 3, 'presentation': 4, 'workday': 5,
  'class': 6, 'other': 7, 'noschool': 8,
};

document.addEventListener('DOMContentLoaded', () => {
  fetch(CSV_URL)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(text => {
      const rows = parseCSV(text).slice(1).filter(r => r.length > COL.date);

      // Collect events by date
      const evsByDate = {};
      rows.forEach(row => {
        const dateStr = fv(row, COL.date);
        if (!dateStr) return;
        const iso = normDateStr(dateStr);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return;
        const type = fv(row, COL.eventType).toLowerCase() || 'other';
        const cancelled = isCancelled(row);
        if (!evsByDate[iso]) evsByDate[iso] = [];
        evsByDate[iso].push({ type, cancelled });
      });

      // Resolve each date to a single CSS class (highest-priority non-cancelled type)
      const dayCls = {};
      Object.entries(evsByDate).forEach(([iso, evs]) => {
        const active = evs.filter(e => !e.cancelled);
        if (active.length) {
          const best = active.sort((a, b) =>
            (TYPE_PRIORITY[a.type] ?? 99) - (TYPE_PRIORITY[b.type] ?? 99))[0];
          dayCls[iso] = 'ev-' + best.type;
        } else {
          dayCls[iso] = 'ev-cancelled';
        }
      });

      // Start from the earliest event's month
      const sortedDates = Object.keys(dayCls).sort();
      if (!sortedDates.length) {
        document.getElementById('year-loading').textContent = 'No events found.';
        return;
      }
      const firstDate  = new Date(sortedDates[0] + 'T00:00:00');
      const startYear  = firstDate.getFullYear();
      const startMonth = firstDate.getMonth(); // 0-based

      const DOW = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      const leftCol  = document.getElementById('col-left');
      const rightCol = document.getElementById('col-right');

      for (let mo = 0; mo < 12; mo++) {
        const ms       = new Date(startYear, startMonth + mo, 1);
        const yr       = ms.getFullYear();
        const moIdx    = ms.getMonth();          // 0-based
        const daysInMo = new Date(yr, moIdx + 1, 0).getDate();
        const moLabel  = ms.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        let html = `<div class="month-block">
<div class="month-title">${esc(moLabel)}</div>
<table class="month-cal" role="presentation">
<thead><tr>${DOW.map(d => `<th>${d}</th>`).join('')}</tr></thead>
<tbody>`;

        let dayNum = 1 - ms.getDay(); // may be negative (empty leading cells)
        while (dayNum <= daysInMo) {
          html += '<tr>';
          for (let dow = 0; dow < 7; dow++, dayNum++) {
            if (dayNum < 1 || dayNum > daysInMo) {
              html += '<td></td>';
            } else {
              const key = `${yr}-${String(moIdx + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
              const cls = dayCls[key];
              html += cls
                ? `<td class="${cls}">${dayNum}</td>`
                : `<td>${dayNum}</td>`;
            }
          }
          html += '</tr>';
        }

        html += '</tbody></table></div>';
        (mo < 6 ? leftCol : rightCol).insertAdjacentHTML('beforeend', html);
      }

      document.getElementById('year-loading').style.display = 'none';
      document.getElementById('year-wrap').style.display    = 'block';
    })
    .catch(() => {
      document.getElementById('year-loading').textContent =
        'Could not load calendar data.';
    });
});
</script>
