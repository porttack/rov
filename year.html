<style>
  #year-wrap { max-width: 860px; margin: 0 auto; }

  .year-legend {
    display: flex; flex-wrap: wrap; gap: 0.4em 1.2em;
    margin: 1.4em 0 0;
    font-size: 0.78em; font-family: Arial, sans-serif; color: #444;
  }
  .leg-item { display: flex; align-items: center; gap: 0.35em; }
  label.leg-item { cursor: pointer; user-select: none; }
  /* The colored swatch is the checkbox: filled with a check when on, an empty
     outlined box when off. The real input stays (hidden) for keyboard/screen readers. */
  label.leg-item input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
  label.leg-item .leg-swatch {
    width: 16px; height: 16px; border-radius: 3px; border: 2px solid rgba(0,0,0,0.25);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1; font-weight: bold; color: rgba(0,0,0,0.65);
  }
  label.leg-item input:checked + .leg-swatch::after { content: '\2713'; }
  label.leg-item input:not(:checked) + .leg-swatch { background: #fff !important; border-color: currentColor; }
  label.leg-item input:focus-visible + .leg-swatch { outline: 2px solid #1a3a6b; outline-offset: 2px; }
  label.leg-item:has(input:not(:checked)) { color: #999; text-decoration: line-through; }
  /* Layout option: not a filter, so unchecked isn't "off" -- keep it normal looking. */
  label.leg-layout:has(input:not(:checked)) { color: inherit; text-decoration: none; }
  label.leg-layout input:not(:checked) + .leg-swatch { background: #fff !important; border-color: rgba(0,0,0,0.35); }
  /* Horizontal: months fill left-to-right, then down (default is down columns first). */
  .year-columns.by-row { grid-auto-flow: row !important; grid-template-rows: none !important; }
  @media (max-width: 560px) { .leg-layout { display: none; } }  /* single column: nothing to switch */
  .leg-swatch {
    width: 11px; height: 11px; border-radius: 2px;
    display: inline-block; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.08);
  }

  /* Month grid. Default: two columns filled top-to-bottom (Jul–Dec left,
     Jan–Jun right). Over 1024px: 4 wide x 3 high, filled top-to-bottom (Jul–Sep, Oct–Dec, Jan–Mar, Apr–Jun).
     Phones: one column. */
  .year-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(6, auto);
    grid-auto-flow: column;
    gap: 1em 2.8em;
  }
  @media (min-width: 1025px) {
    #year-wrap { max-width: 1120px; }
    .year-columns {
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, auto);
      grid-auto-flow: column;
      gap: 1.2em 1.8em;
    }
  }
  @media (max-width: 560px) {
    .year-columns { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-flow: row; }
  }

  #year-tip {
    display: none; position: fixed; z-index: 9999;
    background: #fff; border: 1px solid #c5cae9; border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    padding: 0.55em 0.85em; max-width: 280px; min-width: 150px;
    font-family: Arial, sans-serif; font-size: 0.8em; line-height: 1.5;
    pointer-events: none; color: #222;
  }
  #year-tip.pinned { pointer-events: auto; }
  #year-tip .tip-date    { font-weight: bold; color: #1a3a6b; margin-bottom: 0.2em; }
  #year-tip .tip-prog    { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 0.35em; }
  #year-tip .tip-time    { font-weight: bold; color: #1a3a6b; }
  #year-tip .tip-type    { font-style: italic; color: #444; }
  #year-tip .tip-field   { margin-top: 0.15em; }
  #year-tip .tip-text    { color: #555; margin-top: 0.3em; font-size: 0.95em; white-space: pre-line; }
  #year-tip .tip-photo   { float: right; width: 56px; height: 56px; object-fit: cover; border-radius: 6px; margin: 0 0 0.3em 0.5em; }
  #year-tip .tip-ev::after { content: ''; display: table; clear: both; }
  #year-tip hr           { border: none; border-top: 1px solid #e0e0e0; margin: 0.4em 0; }
  #year-tip .tip-close {
    display: none; position: absolute; top: 0.3em; right: 0.4em;
    width: 28px; height: 28px; line-height: 26px; text-align: center;
    background: #eef1f6; border: none; border-radius: 50%;
    font-size: 1.15em; color: #555; cursor: pointer; padding: 0;
  }
  /* Phones: a pinned card docks as a bottom sheet, away from the tiny day cells. */
  @media screen and (max-width: 560px) {
    #year-tip.pinned {
      position: fixed !important;
      left: 0 !important; right: 0 !important; bottom: 0 !important; top: auto !important;
      width: auto; max-width: none; min-width: 0; max-height: 60vh; overflow-y: auto;
      border-radius: 14px 14px 0 0;
      padding: 0.9em 1em calc(0.9em + env(safe-area-inset-bottom, 0px));
      font-size: 1em; box-shadow: 0 -4px 20px rgba(0,0,0,0.28);
    }
    #year-tip.pinned .tip-close { display: block; }
    #year-tip.pinned .tip-body  { padding-right: 2em; }
  }
  @media print { #year-tip { display: none !important; } }
</style>

<div id="year-loading" style="text-align:center;padding:2em;color:#666;">Loading&hellip;</div>
<div id="year-wrap" style="display:none">
  <!-- 12-month grid, July–June -->
  <div class="year-columns" id="year-months"></div>
  <div class="year-legend" id="year-legend">
    <label class="leg-item"><input type="checkbox" data-cat="hs" checked><span class="leg-swatch" style="background:#93c5fd"></span>HS ROV</label>
    <label class="leg-item"><input type="checkbox" data-cat="charter" checked><span class="leg-swatch" style="background:#86efac"></span>Charter ROV</label>
    <label class="leg-item"><input type="checkbox" data-cat="ms" checked><span class="leg-swatch" style="background:#fdba74"></span>MS ROV</label>
    <label class="leg-item"><input type="checkbox" data-cat="scrimmage" checked><span class="leg-swatch" style="background:#c4b5fd"></span>Scrimmage / competition</label>
    <label class="leg-item"><input type="checkbox" data-cat="outreach" checked><span class="leg-swatch" style="background:#f9a8d4"></span>Outreach</label>
    <label class="leg-item"><input type="checkbox" data-cat="meeting" checked><span class="leg-swatch" style="background:#f97316"></span>Meeting / mentors</label>
    <label class="leg-item"><input type="checkbox" data-cat="cancelled" checked><span class="leg-swatch" style="background:repeating-linear-gradient(135deg,#fecaca 0 3px,#fff 3px 6px)"></span>Canceled</label>
    <label class="leg-item"><input type="checkbox" data-cat="holiday" checked><span class="leg-swatch" style="background:#d1d5db"></span>School holiday</label>
    <span class="leg-item"><span class="leg-swatch" style="background:linear-gradient(135deg,#86efac 50%,#fdba74 50%);width:11px;height:11px;border:1px solid rgba(0,0,0,0.08)"></span>Two or more on one day</span>
    <label class="leg-item leg-layout"><input type="checkbox" data-opt="rows"><span class="leg-swatch" style="background:#fff"></span>Read across (horizontal)</label>
  </div>
</div>

<link rel="stylesheet" href="{{ '/assets/css/rov-calendar.css' | relative_url }}">
<script src="{{ '/assets/js/rov-common.js' | relative_url }}"></script>
<script src="{{ '/assets/js/rov-calendar.js' | relative_url }}"></script>
<script>
const HIDDEN_KEY = 'rov-year-hidden';

document.addEventListener('DOMContentLoaded', () => {
  loadRows()
    .then(rows => {

      const allByDate = collectEvents(rows);

      if (!Object.keys(allByDate).length) {
        document.getElementById('year-loading').textContent = 'No events found.';
        return;
      }

      // Legend checkboxes: unchecked categories are left out of the colors and the hover cards.
      const hidden = new Set();
      const legend = document.getElementById('year-legend');
      const validCats = new Set([...legend.querySelectorAll('input[data-cat]')].map(cb => cb.dataset.cat));
      // A shared link's ?hide=charter,holiday wins over this browser's saved choices.
      const hideParam = new URLSearchParams(location.search).get('hide');
      if (hideParam !== null) {
        hideParam.split(',').map(c => c.trim()).filter(c => validCats.has(c)).forEach(c => hidden.add(c));
      } else {
        try { JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]').forEach(c => { if (validCats.has(c)) hidden.add(c); }); } catch (e) {}
      }
      legend.querySelectorAll('input[data-cat]').forEach(cb => { cb.checked = !hidden.has(cb.dataset.cat); });

      // Layout option: ?rows=1 (or this browser's saved choice) fills months across rows.
      const ROWS_KEY = 'rov-year-rows';
      const rowsParam = new URLSearchParams(location.search).get('rows');
      let byRow = rowsParam !== null ? rowsParam === '1' : false;
      if (rowsParam === null) { try { byRow = localStorage.getItem(ROWS_KEY) === '1'; } catch (e) {} }
      const rowsCb = legend.querySelector('input[data-opt="rows"]');
      rowsCb.checked = byRow;
      document.getElementById('year-months').classList.toggle('by-row', byRow);

      let st = resolveDays(allByDate, hidden);

      // July–June year: July–Dec shows the year starting this July;
      // Jan–Jun shows the year that started last July.
      const now       = new Date();
      const startYear = now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1;

      // All 12 months go in one grid; CSS lays it out (see .year-columns).
      const grid = document.getElementById('year-months');
      function render() {
        st = resolveDays(allByDate, hidden);
        window._yearTipData = st.tipData;
        grid.innerHTML = '';
        for (let mo = 0; mo < 12; mo++) {
          grid.insertAdjacentHTML('beforeend', monthHtml(new Date(startYear, 6 + mo, 1), st));
        }
        if (window._yearTipHide) window._yearTipHide();
      }
      legend.addEventListener('change', e => {
        const cb = e.target;
        if (!cb.dataset) return;
        if (cb.dataset.opt === 'rows') {
          byRow = cb.checked;
          document.getElementById('year-months').classList.toggle('by-row', byRow);
          try { localStorage.setItem(ROWS_KEY, byRow ? '1' : '0'); } catch (err) {}
        } else if (cb.dataset.cat) {
          if (cb.checked) hidden.delete(cb.dataset.cat); else hidden.add(cb.dataset.cat);
          try { localStorage.setItem(HIDDEN_KEY, JSON.stringify([...hidden])); } catch (err) {}
        } else return;
        // Keep the address bar a shareable link of exactly what's showing.
        const url = new URL(location.href);
        if (hidden.size) url.searchParams.set('hide', [...hidden].join(',')); else url.searchParams.delete('hide');
        if (byRow) url.searchParams.set('rows', '1'); else url.searchParams.delete('rows');
        history.replaceState(null, '', url);
        render();
      });
      render();

      document.getElementById('year-loading').style.display = 'none';
      document.getElementById('year-wrap').style.display    = 'block';
    })
    .catch(() => {
      document.getElementById('year-loading').textContent =
        'Could not load calendar data.';
    });
});

// ── Hover / tap tooltip (ported from the rotary site) ─────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const tip = document.createElement('div');
  tip.id = 'year-tip';
  tip.innerHTML = '<button type="button" class="tip-close" aria-label="Close">&times;</button><div class="tip-body"></div>';
  document.body.appendChild(tip);
  const tipBody = tip.querySelector('.tip-body');
  const PROG_LABEL = { hs: 'HS ROV', charter: 'Charter ROV', ms: 'MS ROV' };

  function tipHtml(iso, evs) {
    const [y, m, d] = iso.split('-').map(Number);
    const dateLbl = new Date(y, m - 1, d).toLocaleDateString('en-US',
      { weekday: 'long', month: 'long', day: 'numeric' });
    return `<div class="tip-date">${esc(dateLbl)}</div>` + evs.map((ev, i) => {
      const a = abbrevTime(ev.startTs), b = abbrevTime(ev.endTs);
      const time = a ? (b ? `${a}\u2013${b}` : a) : 'All day';
      let h = i ? '<hr>' : '';
      h += '<div class="tip-ev">';
      if (ev.picture && /^https?:\/\//.test(ev.picture))
        h += `<img class="tip-photo" src="${esc(ev.picture)}" alt="" loading="lazy" onerror="this.remove()">`;
      if (ev.cancelled) h += '<div style="color:#b91c1c;font-size:0.82em;font-weight:bold">CANCELED</div>';
      h += isBigEvent(ev)
        ? `<div class="tip-time"><span class="tip-prog" style="background:${EVENT_COLORS[ev.type]}"></span>${EVENT_LABELS[ev.type]} \u00b7 ${esc(time)}</div>`
        : ev.type === 'noschool'
        ? `<div class="tip-time"><span class="tip-prog" style="background:${HOLIDAY_COLOR}"></span>School holiday</div>`
        : `<div class="tip-time"><span class="tip-prog" style="background:${PROGRAM_COLORS[ev.program]}"></span>${esc(PROG_LABEL[ev.program])} \u00b7 ${esc(time)}</div>`;
      if (ev.type !== 'noschool' && !(isBigEvent(ev) && ev.desc.toLowerCase() === ev.type)) h += `<div class="tip-field">${esc(ev.desc)}</div>`;
      if (ev.type && ev.type !== 'noschool' && !isBigEvent(ev) && ev.type !== ev.desc.toLowerCase()) h += `<div class="tip-type">${esc(ev.type)}</div>`;
      if (ev.location) h += `<div class="tip-field">${mapLink(ev.location)}</div>`;
      if (ev.summary)  h += `<div class="tip-text">${esc(ev.summary)}</div>`;
      if (ev.comments) h += `<div class="tip-text">${esc(ev.comments)}</div>`;
      return h + '</div>';
    }).join('');
  }

  function placeAtCursor(e) {
    const pad = 14, tw = tip.offsetWidth, th = tip.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight;
    tip.style.left = (e.clientX + pad + tw < vw) ? (e.clientX + pad) + 'px' : Math.max(4, e.clientX - pad - tw) + 'px';
    tip.style.top  = (e.clientY + pad + th < vh) ? (e.clientY + pad) + 'px' : Math.max(4, e.clientY - pad - th) + 'px';
  }
  function placeNearEl(el) {
    const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight, pad = 8;
    let top = r.bottom + pad;
    if (top + th > vh - 4) top = Math.max(4, r.top - th - pad);
    tip.style.top  = top + 'px';
    tip.style.left = Math.max(4, Math.min(vw - tw - 4, r.left + r.width / 2 - tw / 2)) + 'px';
  }
  function showForCell(td) {
    const evs = window._yearTipData && window._yearTipData[td.dataset.date];
    if (!evs || !evs.length) return false;
    tipBody.innerHTML = tipHtml(td.dataset.date, evs);
    tip.style.display = 'block';
    return true;
  }
  function hideTip() { tip.style.display = 'none'; tip.classList.remove('pinned'); pinned = null; cur = null; }
  window._yearTipHide = hideTip;

  let cur = null, pinned = null;
  // iOS treats a tap as "reveal hover" if mouseover changes the page, which
  // swallows the click; touch devices therefore only get tap-to-pin.
  const IS_TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);

  document.addEventListener('mouseover', e => {
    if (IS_TOUCH || pinned) return;
    const td = e.target.closest && e.target.closest('td[data-date]');
    if (!td || td === cur) return;
    cur = td;
    if (showForCell(td)) placeAtCursor(e); else tip.style.display = 'none';
  });
  document.addEventListener('mousemove', e => {
    if (IS_TOUCH || pinned || tip.style.display === 'none') return;
    placeAtCursor(e);
  });
  document.addEventListener('mouseout', e => {
    if (IS_TOUCH || pinned) return;
    if (e.target === cur) { tip.style.display = 'none'; cur = null; }
  });
  document.addEventListener('click', e => {
    if (e.target.closest && e.target.closest('.tip-close')) { hideTip(); e.stopPropagation(); return; }
    const td = e.target.closest && e.target.closest('td[data-date]');
    if (td) {
      if (td === pinned) hideTip();
      else if (showForCell(td)) { pinned = td; cur = null; placeNearEl(td); tip.classList.add('pinned'); }
      e.stopPropagation();
    } else if (e.target.closest && e.target.closest('#year-tip')) {
      return;   // taps inside the pinned card (e.g. the map link) are not "outside"
    } else if (pinned) hideTip();
  });
});
</script>
