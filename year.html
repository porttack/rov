---
layout: page
title: Year
permalink: /year/
---

<style>
  #year-wrap { max-width: 860px; margin: 0 auto; }

  .year-legend {
    display: flex; flex-wrap: wrap; gap: 0.4em 1.2em;
    margin: 1.4em 0 0;
    font-size: 0.78em; font-family: Arial, sans-serif; color: #444;
  }
  .leg-item { display: flex; align-items: center; gap: 0.35em; }
  .leg-swatch {
    width: 11px; height: 11px; border-radius: 2px;
    display: inline-block; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.08);
  }

  /* Two-column layout: left half / right half */
  .year-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 2.8em;
  }
  @media (max-width: 560px) {
    .year-columns { grid-template-columns: 1fr; }
  }
  .year-col { display: flex; flex-direction: column; gap: 1em; }

  .month-title {
    font-family: Arial, sans-serif; font-weight: bold;
    font-size: 0.82em; color: #1a3a6b;
    margin-bottom: 0.2em; letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .month-cal {
    width: 100%; border-collapse: collapse;
    font-family: Arial, sans-serif; font-size: 0.72em;
    table-layout: fixed;
  }
  .month-cal th {
    text-align: center; padding: 1px 0;
    color: #888; font-weight: bold; font-size: 0.82em;
  }
  .month-cal td {
    text-align: center; padding: 2px 1px; line-height: 1.55;
    border-radius: 2px;
  }
  .month-cal td:empty { background: none; }

  /* Day colors are set inline per program (see PROGRAM_COLORS in the script);
     two or three programs on one day get a diagonal split. */
  .month-cal td.ev-cancelled  { background: #e5e7eb; color: #aaa; }
  .month-cal td.ev-competition { font-weight: bold; box-shadow: inset 0 0 0 2px #166534; }
  .leg-comp { background: #fff; box-shadow: inset 0 0 0 2px #166534; }
  .month-cal td[data-date] { cursor: pointer; }
  /* Fade months that are over, and the days already gone in the current month. */
  .month-block.month-past { opacity: 0.42; }
  .month-cal td.day-past  { opacity: 0.48; }
  @media screen and (max-width: 560px) {
    .month-block.month-past { display: none; }  /* phones: drop past months; print keeps all */
  }
  .month-cal td.today { outline: 2px solid #dc2626; outline-offset: -1px; font-weight: bold; }
  .month-cal td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  #year-tip {
    display: none; position: fixed; z-index: 9999;
    background: #fff; border: 1px solid #c5cae9; border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    padding: 0.55em 0.85em; max-width: 280px; min-width: 150px;
    font-family: Arial, sans-serif; font-size: 0.8em; line-height: 1.5;
    pointer-events: none; color: #222;
  }
  #year-tip.pinned { pointer-events: auto; }
  #year-tip .tip-date    { font-weight: bold; color: #1a3a6b; margin-bottom: 0.2em; }
  #year-tip .tip-prog    { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 0.35em; }
  #year-tip .tip-time    { font-weight: bold; color: #1a3a6b; }
  #year-tip .tip-type    { font-style: italic; color: #444; }
  #year-tip .tip-field   { margin-top: 0.15em; }
  #year-tip .tip-text    { color: #555; margin-top: 0.3em; font-size: 0.95em; white-space: pre-line; }
  #year-tip .tip-photo   { float: right; width: 56px; height: 56px; object-fit: cover; border-radius: 6px; margin: 0 0 0.3em 0.5em; }
  #year-tip .tip-ev::after { content: ''; display: table; clear: both; }
  #year-tip hr           { border: none; border-top: 1px solid #e0e0e0; margin: 0.4em 0; }
  #year-tip .tip-close {
    display: none; position: absolute; top: 0.3em; right: 0.4em;
    width: 28px; height: 28px; line-height: 26px; text-align: center;
    background: #eef1f6; border: none; border-radius: 50%;
    font-size: 1.15em; color: #555; cursor: pointer; padding: 0;
  }
  /* Phones: a pinned card docks as a bottom sheet, away from the tiny day cells. */
  @media screen and (max-width: 560px) {
    #year-tip.pinned {
      position: fixed !important;
      left: 0 !important; right: 0 !important; bottom: 0 !important; top: auto !important;
      width: auto; max-width: none; min-width: 0; max-height: 60vh; overflow-y: auto;
      border-radius: 14px 14px 0 0;
      padding: 0.9em 1em calc(0.9em + env(safe-area-inset-bottom, 0px));
      font-size: 1em; box-shadow: 0 -4px 20px rgba(0,0,0,0.28);
    }
    #year-tip.pinned .tip-close { display: block; }
    #year-tip.pinned .tip-body  { padding-right: 2em; }
  }
  @media print { #year-tip { display: none !important; } }
</style>

<div id="year-loading" style="text-align:center;padding:2em;color:#666;">Loading&hellip;</div>
<div id="year-wrap" style="display:none">
  <!-- 12-month grid, July–June -->
  <div class="year-columns">
    <div class="year-col" id="col-left"></div>
    <div class="year-col" id="col-right"></div>
  </div>
  <div class="year-legend">
    <span class="leg-item"><span class="leg-swatch" style="background:#93c5fd"></span>HS ROV</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#86efac"></span>Charter ROV</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#fdba74"></span>MS ROV</span>
    <span class="leg-item"><span class="leg-swatch" style="background:linear-gradient(135deg,#86efac 50%,#fdba74 50%)"></span>Two programs</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#fca5a5"></span>School holiday</span>
    <span class="leg-item"><span class="leg-swatch leg-comp"></span>Competition</span>
  </div>
</div>

<script src="{{ '/assets/js/rov-common.js' | relative_url }}"></script>
<script>
// Program fill colors; a day with several programs is split in this order.
const PROGRAM_COLORS = { hs: '#93c5fd', charter: '#86efac', ms: '#fdba74' };
const PROGRAMS = Object.keys(PROGRAM_COLORS);
const HOLIDAY_COLOR = '#fca5a5';   // no-school days, same red as the rotary site

document.addEventListener('DOMContentLoaded', () => {
  loadRows()
    .then(rows => {

      // Collect events by date
      const evsByDate = {};
      rows.forEach(row => {
        const dateStr = fv(row, COL.date);
        if (!dateStr) return;
        const iso = normDateStr(dateStr);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return;
        const type = fv(row, COL.eventType).toLowerCase() || 'other';
        const cancelled = isCancelled(row);
        if (!evsByDate[iso]) evsByDate[iso] = [];
        let program = fv(row, COL.program).toLowerCase();
        if (!PROGRAM_COLORS[program]) program = 'hs';   // blank/unknown = HS
        evsByDate[iso].push({
          type, cancelled, program,
          startTs: fv(row, COL.startTime), endTs: fv(row, COL.endTime),
          desc: getDesc(row), summary: fv(row, COL.summary), picture: fv(row, COL.picture),
          comments: fv(row, COL.comments), location: fv(row, COL.location),
        });
      });

      // Tooltip data, per date, in time order.
      window._yearTipData = {};
      Object.entries(evsByDate).forEach(([iso, evs]) => {
        window._yearTipData[iso] = evs.slice().sort((a, b) => to24h(a.startTs).localeCompare(to24h(b.startTs)));
      });

      // Resolve each date to a fill: school holidays (noschool, red as on the
      // rotary site) plus each program with a non-cancelled event; several
      // colors split the cell diagonally. Cancelled-only days are gray.
      const dayCls = {}, dayStyle = {};
      Object.entries(evsByDate).forEach(([iso, evs]) => {
        const active = evs.filter(e => !e.cancelled);
        if (!active.length) { dayCls[iso] = 'ev-cancelled'; return; }
        const real = active.filter(e => e.type !== 'noschool');
        const colors = [];
        if (real.length < active.length) colors.push(HOLIDAY_COLOR);
        PROGRAMS.forEach(p => { if (real.some(e => e.program === p)) colors.push(PROGRAM_COLORS[p]); });
        const n = colors.length;
        dayStyle[iso] = n === 1 ? colors[0]
          : 'linear-gradient(135deg,' + colors.map((c, i) =>
              `${c} ${(100 * i / n).toFixed(1)}% ${(100 * (i + 1) / n).toFixed(1)}%`).join(',') + ')';
        dayCls[iso] = real.some(e => e.type === 'competition') ? 'ev-competition' : '';
      });

      if (!Object.keys(dayCls).length) {
        document.getElementById('year-loading').textContent = 'No events found.';
        return;
      }
      // Build HTML for a single month grid
      const t = new Date();
      const todayKey = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
      const DOW = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      function buildMonthHtml(ms) {
        const yr       = ms.getFullYear();
        const moIdx    = ms.getMonth();
        const daysInMo = new Date(yr, moIdx + 1, 0).getDate();
        const moLabel  = ms.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        const isPastMonth    = yr < t.getFullYear() || (yr === t.getFullYear() && moIdx < t.getMonth());
        const isCurrentMonth = yr === t.getFullYear() && moIdx === t.getMonth();

        let html = `<div class="month-block${isPastMonth ? ' month-past' : ''}">
<div class="month-title">${esc(moLabel)}</div>
<table class="month-cal" role="presentation">
<thead><tr>${DOW.map(d => `<th>${d}</th>`).join('')}</tr></thead>
<tbody>`;

        let dayNum = 1 - ms.getDay();
        while (dayNum <= daysInMo) {
          html += '<tr>';
          for (let dow = 0; dow < 7; dow++, dayNum++) {
            if (dayNum < 1 || dayNum > daysInMo) {
              html += '<td></td>';
            } else {
              const key = `${yr}-${String(moIdx + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
              const cls = [dayCls[key], key === todayKey ? 'today' : '',
                           isCurrentMonth && dayNum < t.getDate() ? 'day-past' : ''].filter(Boolean).join(' ');
              const dd  = evsByDate[key] ? ` data-date="${key}"` : '';
              const bg  = dayStyle[key] ? ` style="background:${dayStyle[key]}"` : '';
              html += `<td${cls ? ` class="${cls}"` : ''}${dd}${bg}>${dayNum}</td>`;
            }
          }
          html += '</tr>';
        }
        return html + '</tbody></table></div>';
      }

      // July–June year: July–Dec shows the year starting this July;
      // Jan–Jun shows the year that started last July.
      const now       = new Date();
      const startYear = now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1;

      // July–Dec on the left, Jan–June on the right.
      const leftCol  = document.getElementById('col-left');
      const rightCol = document.getElementById('col-right');
      for (let mo = 0; mo < 12; mo++) {
        const ms = new Date(startYear, 6 + mo, 1);
        (mo < 6 ? leftCol : rightCol).insertAdjacentHTML('beforeend', buildMonthHtml(ms));
      }

      document.getElementById('year-loading').style.display = 'none';
      document.getElementById('year-wrap').style.display    = 'block';
    })
    .catch(() => {
      document.getElementById('year-loading').textContent =
        'Could not load calendar data.';
    });
});

// ── Hover / tap tooltip (ported from the rotary site) ─────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const tip = document.createElement('div');
  tip.id = 'year-tip';
  tip.innerHTML = '<button type="button" class="tip-close" aria-label="Close">&times;</button><div class="tip-body"></div>';
  document.body.appendChild(tip);
  const tipBody = tip.querySelector('.tip-body');
  const PROG_LABEL = { hs: 'HS ROV', charter: 'Charter ROV', ms: 'MS ROV' };

  function tipHtml(iso, evs) {
    const [y, m, d] = iso.split('-').map(Number);
    const dateLbl = new Date(y, m - 1, d).toLocaleDateString('en-US',
      { weekday: 'long', month: 'long', day: 'numeric' });
    return `<div class="tip-date">${esc(dateLbl)}</div>` + evs.map((ev, i) => {
      const a = abbrevTime(ev.startTs), b = abbrevTime(ev.endTs);
      const time = a ? (b ? `${a}\u2013${b}` : a) : 'All day';
      let h = i ? '<hr>' : '';
      h += '<div class="tip-ev">';
      if (ev.picture && /^https?:\/\//.test(ev.picture))
        h += `<img class="tip-photo" src="${esc(ev.picture)}" alt="" loading="lazy" onerror="this.remove()">`;
      if (ev.cancelled) h += '<div style="color:#b91c1c;font-size:0.82em;font-weight:bold">CANCELLED</div>';
      h += ev.type === 'noschool'
        ? `<div class="tip-time"><span class="tip-prog" style="background:${HOLIDAY_COLOR}"></span>School holiday</div>`
        : `<div class="tip-time"><span class="tip-prog" style="background:${PROGRAM_COLORS[ev.program]}"></span>${esc(PROG_LABEL[ev.program])} \u00b7 ${esc(time)}</div>`;
      if (ev.type !== 'noschool' || ev.desc.toLowerCase() !== 'noschool') h += `<div class="tip-field">${esc(ev.desc)}</div>`;
      if (ev.type && ev.type !== 'noschool' && ev.type !== ev.desc.toLowerCase()) h += `<div class="tip-type">${esc(ev.type)}</div>`;
      if (ev.location) h += `<div class="tip-field">${mapLink(ev.location)}</div>`;
      if (ev.summary)  h += `<div class="tip-text">${esc(ev.summary)}</div>`;
      if (ev.comments) h += `<div class="tip-text">${esc(ev.comments)}</div>`;
      return h + '</div>';
    }).join('');
  }

  function placeAtCursor(e) {
    const pad = 14, tw = tip.offsetWidth, th = tip.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight;
    tip.style.left = (e.clientX + pad + tw < vw) ? (e.clientX + pad) + 'px' : Math.max(4, e.clientX - pad - tw) + 'px';
    tip.style.top  = (e.clientY + pad + th < vh) ? (e.clientY + pad) + 'px' : Math.max(4, e.clientY - pad - th) + 'px';
  }
  function placeNearEl(el) {
    const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight, pad = 8;
    let top = r.bottom + pad;
    if (top + th > vh - 4) top = Math.max(4, r.top - th - pad);
    tip.style.top  = top + 'px';
    tip.style.left = Math.max(4, Math.min(vw - tw - 4, r.left + r.width / 2 - tw / 2)) + 'px';
  }
  function showForCell(td) {
    const evs = window._yearTipData && window._yearTipData[td.dataset.date];
    if (!evs || !evs.length) return false;
    tipBody.innerHTML = tipHtml(td.dataset.date, evs);
    tip.style.display = 'block';
    return true;
  }
  function hideTip() { tip.style.display = 'none'; tip.classList.remove('pinned'); pinned = null; }

  let cur = null, pinned = null;
  // iOS treats a tap as "reveal hover" if mouseover changes the page, which
  // swallows the click; touch devices therefore only get tap-to-pin.
  const IS_TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);

  document.addEventListener('mouseover', e => {
    if (IS_TOUCH || pinned) return;
    const td = e.target.closest && e.target.closest('td[data-date]');
    if (!td || td === cur) return;
    cur = td;
    if (showForCell(td)) placeAtCursor(e); else tip.style.display = 'none';
  });
  document.addEventListener('mousemove', e => {
    if (IS_TOUCH || pinned || tip.style.display === 'none') return;
    placeAtCursor(e);
  });
  document.addEventListener('mouseout', e => {
    if (IS_TOUCH || pinned) return;
    if (e.target === cur) { tip.style.display = 'none'; cur = null; }
  });
  document.addEventListener('click', e => {
    if (e.target.closest && e.target.closest('.tip-close')) { hideTip(); e.stopPropagation(); return; }
    const td = e.target.closest && e.target.closest('td[data-date]');
    if (td) {
      if (td === pinned) hideTip();
      else if (showForCell(td)) { pinned = td; cur = null; placeNearEl(td); tip.classList.add('pinned'); }
      e.stopPropagation();
    } else if (e.target.closest && e.target.closest('#year-tip')) {
      return;   // taps inside the pinned card (e.g. the map link) are not "outside"
    } else if (pinned) hideTip();
  });
});
</script>
